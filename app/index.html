<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Enlace Digital - Acceso Contratistas</title>
    <link rel="shortcut icon" href="../image/enlace.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Documentación: 
        - Bootstrap 5 para responsividad y estilos
        - stylelogin.css para personalización adicional
    -->
    <style>
        /* Estilos adicionales para mejor experiencia en móviles */
        .gradient-custom {
            /* fallback for old browsers */
            background: #6a11cb;
            /* Chrome 10-25, Safari 5.1-6 */
            background: -webkit-linear-gradient(to right, #2575fc, #6a11cb);
            /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            background: linear-gradient(to right, #2575fc, #6a11cb);
        }
        .card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        @media (max-width: 576px) {
            .card-body {
                padding: 2rem 1rem !important;
            }
            .card img {
                width: 100% !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Sección principal de login, responsiva y centrada -->
    <section class="vh-100 gradient-custom d-flex align-items-center">
        <div class="container py-5 h-100">
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card bg-dark text-white rounded-4">
                        <div class="card-body p-5 text-center">
                            <form action="Login/login1.php" method="post" accept-charset="utf-8" id="login" name="login" autocomplete="off">
                                <div class="mb-md-5 mt-md-4 pb-4">
                                    <img src="../image/enlace.png" alt="Enlace Digital" class="mb-4" style="max-width:80%;height:80%;">
                                    <div class="form-outline form-white mb-4">
                                        <input type="text" id="User_Contratista" name="User_Contratista" class="form-control form-control-lg" placeholder="Usuario" required autofocus autocomplete="username" />
                                    </div>
                                    <div class="form-outline form-white mb-4">
                                        <input type="password" id="Pass_Contratista" name="Pass_Contratista" class="form-control form-control-lg" placeholder="Contraseña" required autocomplete="current-password" />
                                    </div>
                                    <button class="btn btn-outline-light btn-lg px-5 w-100" type="submit">Iniciar sesión</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Script para mejorar UX: Enter en password envía el formulario -->
    <script>
        document.getElementById('login').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                this.submit();
            }
        });
    </script>
</body>
</html>
